name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]' mypy
      - name: mypy --strict (core modules)
        run: mypy --strict src/core/conversions.py src/core/fees.py src/core/options.py src/core/oms.py src/core/portfolio_risk.py src/strategy/credit_spread.py scripts/golive_check.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - name: dependency audit
        run: pip-audit -r <(pip freeze > /dev/null; pip install -e '.[dev]' >/dev/null 2>&1; pip freeze) --disable-pip || true
        # strict: uncomment to hard-fail on any known CVE in pinned deps
      - name: no secrets in repo tree
        run: |
          ! grep -rIlE '(api_secret|API_SECRET)\s*=\s*["'\''][A-Za-z0-9_\-]{16,}' src scripts tests config || \
          (echo "secret-looking literal in source"; exit 1)

  tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]' pytest-cov
      - name: pytest with coverage gate (risk/strategy/execution >= 85%)
        run: |
          pytest tests -q \
            --cov --cov-config=.coveragerc_gate \
            --cov-report=term-missing \
            --cov-fail-under=85
      - name: golden backtest regression
        run: pytest tests/test_golden_backtest.py -q
      - name: go-live gates must fail-closed (paper-only guarantee)
        run: |
          set +e
          python scripts/golive_check.py --json > gates_out.txt 2>&1
          RC=$?
          set -e
          python - "$RC" <<'PYEOF'
          import json, re, sys

          rc = int(sys.argv[1])
          text = open("gates_out.txt").read()
          m = re.search(r"GATES_JSON_BEGIN(.*?)GATES_JSON_END", text, re.S)
          assert m, f"golive_check produced no gates JSON (rc={rc}):\n{text[-500:]}"
          gates = json.loads(m.group(1))
          all_passed = all(g["passed"] for g in gates.values())
          if all_passed:
              assert rc == 0, "gates earned but golive_check failed"
          else:
              assert rc != 0, "unearned gates must fail golive_check (fail-closed)"
              print("ok: golive_check fails closed while gates are unearned")
          PYEOF

  docker:
    runs-on: ubuntu-latest
    needs: [tests, types]
    if: github.ref == 'refs/heads/main'
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (non-root, pinned base)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true   # keep image in docker engine so the trivy scan can see it
          tags: fund-manager:${{ github.sha }}
      - name: scan image (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fund-manager:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"   # report-only until pinned base covers CVEs
