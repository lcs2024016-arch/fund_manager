[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-manager"
version = "0.1.0"
description = "Multi-strategy trading bots for Delta Exchange India (rwa_positional + all_in_one)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Legacy modules predating the M1-M3 risk-first milestone are lint-excluded;
# everything shipped in this milestone (core risk modules, credit_spread,
# scripts, tests) is fully linted.
extend-exclude = [
  "src/core/risk.py",
  "src/core/models.py",
  "src/core/ports.py",
  "src/core/indicators.py",
  "src/core/scheduler.py",
  "src/core/events.py",
  "src/core/ledger.py",
  "src/core/state.py",
  "src/strategy/all_in_one",
  "src/strategy/rwa_positional",
  "src/backtest",
  "src/paper",
  "src/live",
  "src/delta",
  "src/main.py",
  "src/tools",
  "tests/test_aio_*",
  "tests/test_rwa_*",
  "tests/test_auth.py",
  "tests/test_backtest_*",
  "tests/test_config_ask.py",
  "tests/test_indicators.py",
  "tests/test_ledger.py",
  "tests/test_products.py",
  "tests/test_ratelimit.py",
  "tests/test_state.py",
  "tests/conftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

